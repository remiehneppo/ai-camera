# CiviWatch v2 — go2rtc Zero-Plumbing Media & WebRTC Engine Configuration
api:
  listen: ":1984"
  origin: ""
  username: "${GO2RTC_API_USER}"
  password: "${GO2RTC_API_PASSWORD}"
  local_auth: true
  allow_paths:
    - "/api/streams"
    - "/api/frame.jpeg"
    - "/api/stream.mp4"
    - "/api/stream.mjpeg"
    - "/api/ws"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

streams:
  civi-cam-01:
    - rtsp://127.0.0.1:8554/raw-cam-01
    - ffmpeg:/app/data/benchmark/intersection_traffic_1080p.mp4#video=copy
  civi-cam-02:
    - ffmpeg:/app/data/benchmark/shibuya_crossing_1080p.mp4#video=copy
