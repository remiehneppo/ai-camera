<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Camera Lab Events</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 960px; padding: 2rem 1rem; }
    h1 { margin-bottom: .25rem; }
    .muted { opacity: .72; }
    #status { min-height: 1.5rem; }
    .event { border: 1px solid #8886; border-radius: .5rem; margin: .75rem 0; padding: 1rem; }
    .event header { display: flex; gap: .6rem; flex-wrap: wrap; align-items: baseline; }
    code, time { overflow-wrap: anywhere; }
    button { font: inherit; padding: .35rem .7rem; }
    .evidence-section { margin-top: .75rem; border-top: 1px solid #8883; padding-top: .5rem; }
    .badge { display: inline-block; padding: .15rem .45rem; border-radius: .25rem; font-size: .85em; font-weight: 500; }
    .badge-pending { background: #e0990033; color: #d97706; }
    .badge-complete { background: #10b98133; color: #059669; }
    .badge-partial { background: #3b82f633; color: #2563eb; }
    .badge-available { background: #10b98133; color: #059669; }
    .badge-rtsp { background: #10b98133; color: #059669; }
    .badge-fallback { background: #e0990033; color: #d97706; }
    video { width: 100%; max-width: 640px; height: auto; border-radius: .35rem; display: block; margin: .5rem 0; background: #000; }
    .evidence-item { margin: .5rem 0; }
    .evidence-actions { display: flex; gap: .75rem; align-items: baseline; }
    .live-card { border: 1px solid #8886; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
    .live-card header { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
    .live-card h2 { margin: 0; font-size: 1.25rem; }
    .live-controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .live-feed-wrapper { position: relative; width: 100%; max-width: 720px; min-height: 220px; background: #111; border-radius: .35rem; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #live-feed { width: 100%; height: auto; display: block; border-radius: .35rem; }
  </style>
</head>
<body>
  <h1>AI Camera Lab Events</h1>
  <p class="muted">Metadata from committed event snapshots. Synthetic and replay events never notify.</p>
  <button id="auth">Set dashboard token</button>
  <section class="live-card" aria-label="Live Camera Stream">
    <header>
      <h2>Live Camera Stream</h2>
      <div class="live-controls">
        <button id="live-toggle" type="button">Start Stream</button>
        <span id="live-source-badge" class="badge">Source: --</span>
        <span id="live-fps-badge" class="badge">FPS: --</span>
        <span id="live-detections-badge" class="badge">Detections: --</span>
      </div>
    </header>
    <div class="live-feed-wrapper">
      <img id="live-feed" src="" alt="Live Stream" style="display: none;">
      <p id="live-feed-placeholder" class="muted">Live stream idle. Click "Start Stream" to play.</p>
    </div>
  </section>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <main id="events" aria-label="Events"></main>
  <script>
    (() => {
      let token = "";
      let reviewerToken = "";
      let isStreaming = false;
      const status = document.querySelector("#status");
      const list = document.querySelector("#events");
      const liveToggle = document.querySelector("#live-toggle");
      const liveFeed = document.querySelector("#live-feed");
      const livePlaceholder = document.querySelector("#live-feed-placeholder");
      const liveSourceBadge = document.querySelector("#live-source-badge");
      const liveFpsBadge = document.querySelector("#live-fps-badge");
      const liveDetectionsBadge = document.querySelector("#live-detections-badge");

      function updateStreamUI() {
        if (isStreaming) {
          liveFeed.src = `/v1/live/stream?token=${encodeURIComponent(token)}`;
          liveFeed.style.display = "block";
          livePlaceholder.style.display = "none";
          liveToggle.textContent = "Pause Stream";
        } else {
          liveFeed.src = "";
          liveFeed.style.display = "none";
          livePlaceholder.style.display = "block";
          liveToggle.textContent = "Start Stream";
        }
      }

      liveToggle.addEventListener("click", () => {
        if (!token) {
          token = window.prompt("Dashboard bearer token") || "";
          if (!token) return;
          refresh();
        }
        isStreaming = !isStreaming;
        updateStreamUI();
      });

      async function pollLiveStatus() {
        if (!token) return;
        try {
          const res = await fetch(`/v1/live/status?token=${encodeURIComponent(token)}`);
          if (res.ok) {
            const data = await res.json();
            const src = (data.source || "--").toUpperCase();
            liveSourceBadge.textContent = `Source: ${src}`;
            liveSourceBadge.className = `badge badge-${src.toLowerCase() === "rtsp" ? "rtsp" : "fallback"}`;
            liveFpsBadge.textContent = `FPS: ${typeof data.fps === "number" ? data.fps.toFixed(1) : data.fps}`;
            liveDetectionsBadge.textContent = `Detections: ${data.detections_count ?? 0}`;
          }
        } catch (_) {}
      }
      window.setInterval(pollLiveStatus, 2000);
      document.querySelector("#auth").addEventListener("click", () => {
        token = window.prompt("Dashboard bearer token") || "";
        pollLiveStatus();
        if (isStreaming) updateStreamUI();
        refresh();
      });
      const add = (parent, tag, text, className) => {
        const node = document.createElement(tag);
        node.textContent = text;
        if (className) node.className = className;
        parent.append(node);
        return node;
      };
      async function refresh() {
        if (!token) { status.textContent = "Enter the dashboard token to load events."; return; }
        status.textContent = "Loading events…";
        try {
          const response = await fetch("/v1/events?limit=50", { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(response.status === 401 ? "Dashboard token rejected." : `Request failed (${response.status}).`);
          const data = await response.json();
          list.replaceChildren();
          if (!data.events.length) {
            status.textContent = "No events yet. Run the edge synthetic fixture to add one.";
            return;
          }
          for (const row of data.events) {
            const event = row.event;
            const card = document.createElement("article");
            card.className = "event";
            const header = document.createElement("header");
            add(header, "strong", event.payload.taxonomy || "Event");
            add(header, "span", event.origin, "muted");
            add(card, "h2", `${event.camera_id} · revision ${event.revision}`);
            card.prepend(header);
            add(card, "p", `${event.payload.lifecycle || "unknown"} · ${event.payload.severity || "unknown"} · quality ${event.quality_state}`);
            const time = add(card, "time", event.event_time);
            time.dateTime = event.event_time;
            add(card, "p", `Event ${event.event_id}`, "muted");
            const review = row.review;
            add(card, "p", `Review: ${review.decision} · version ${review.review_version}${review.needs_re_review ? " · needs re-review" : ""}`);
            if (data.review_enabled) {
              const controls = document.createElement("p");
              const addReviewButton = (action, label) => {
                const button = add(controls, "button", label);
                button.type = "button";
                button.addEventListener("click", () => submitReview(row, action));
              };
              if (review.needs_re_review) {
                addReviewButton("reopen", "Reopen for re-review");
              } else if (review.decision === "unreviewed") {
                addReviewButton("confirm", "Confirm");
                addReviewButton("false_positive", "False positive");
              } else if (review.decision === "confirmed") {
                addReviewButton("resolve", "Resolve");
                addReviewButton("reopen", "Reopen");
              } else {
                addReviewButton("reopen", "Reopen");
              }
              card.append(controls);
            }
            if (review.audit.length) {
              const history = document.createElement("details");
              add(history, "summary", `Review audit (${review.audit.length})`);
              for (const entry of review.audit) {
                add(history, "p", `v${entry.review_version} ${entry.action} → ${entry.decision} · ${entry.actor} · ${entry.created_at} · ${entry.reason}`);
              }
              card.append(history);
            }

            const evidenceRequests = event.payload.evidence_requests || [];
            const uploadedEvidences = row.evidence || [];
            const evidenceByReq = new Map();
            for (const ev of uploadedEvidences) {
              evidenceByReq.set(ev.request_id, ev);
            }

            if (evidenceRequests.length || uploadedEvidences.length) {
              const evSection = document.createElement("section");
              evSection.className = "evidence-section";
              add(evSection, "h3", "Evidence Clips");

              const handledReqIds = new Set();
              for (const req of evidenceRequests) {
                handledReqIds.add(req.request_id);
                const evItem = document.createElement("div");
                evItem.className = "evidence-item";
                const evDoc = evidenceByReq.get(req.request_id);
                if (evDoc) {
                  const manifest = evDoc.manifest || {};
                  const completeness = manifest.completeness || "available";
                  const rangeStr = Array.isArray(manifest.actual_range)
                    ? `[${manifest.actual_range[0]}s - ${manifest.actual_range[1]}s]`
                    : "range recorded";
                  add(evItem, "span", `${completeness} · ${rangeStr}`, `badge badge-${completeness}`);

                  const video = document.createElement("video");
                  video.controls = true;
                  video.preload = "metadata";
                  const mediaUrl = `/v1/evidence/${encodeURIComponent(event.device_id)}/${encodeURIComponent(event.event_id)}/${encodeURIComponent(req.request_id)}/media?token=${encodeURIComponent(token)}`;
                  video.src = mediaUrl;
                  evItem.append(video);

                  const actions = document.createElement("div");
                  actions.className = "evidence-actions";
                  const dl = document.createElement("a");
                  dl.href = mediaUrl;
                  dl.download = `${req.request_id}.mkv`;
                  dl.textContent = "Download clip";
                  actions.append(dl);
                  if (manifest.size_bytes) {
                    add(actions, "span", `${(manifest.size_bytes / 1024).toFixed(1)} KB`, "muted");
                  }
                  evItem.append(actions);
                } else {
                  add(evItem, "span", `Pending upload for ${req.request_id}`, "badge badge-pending");
                  add(evItem, "p", `Requested [${req.requested_start}s - ${req.requested_end}s] (${req.evidence_anchor_kind})`, "muted");
                }
                evSection.append(evItem);
              }

              for (const ev of uploadedEvidences) {
                if (!handledReqIds.has(ev.request_id)) {
                  const evItem = document.createElement("div");
                  evItem.className = "evidence-item";
                  const manifest = ev.manifest || {};
                  const completeness = manifest.completeness || "available";
                  add(evItem, "span", `${completeness} (${ev.request_id})`, `badge badge-${completeness}`);
                  const video = document.createElement("video");
                  video.controls = true;
                  video.preload = "metadata";
                  const mediaUrl = `/v1/evidence/${encodeURIComponent(event.device_id)}/${encodeURIComponent(event.event_id)}/${encodeURIComponent(ev.request_id)}/media?token=${encodeURIComponent(token)}`;
                  video.src = mediaUrl;
                  evItem.append(video);
                  const actions = document.createElement("div");
                  actions.className = "evidence-actions";
                  const dl = document.createElement("a");
                  dl.href = mediaUrl;
                  dl.download = `${ev.request_id}.mkv`;
                  dl.textContent = "Download clip";
                  actions.append(dl);
                  evItem.append(actions);
                  evSection.append(evItem);
                }
              }
              card.append(evSection);
            }

            const detail = document.createElement("details");
            add(detail, "summary", "Event snapshot");
            add(detail, "pre", JSON.stringify(event, null, 2));
            card.append(detail);
            list.append(card);
          }
          status.textContent = `Showing ${data.events.length} event${data.events.length === 1 ? "" : "s"}. Refreshes every 3 seconds.`;
        } catch (error) {
          status.textContent = `${error.message} Check the API and try again.`;
        }
      }
      async function submitReview(row, action) {
        if (!reviewerToken) reviewerToken = window.prompt("Reviewer bearer token") || "";
        if (!reviewerToken) return;
        const reason = window.prompt(`Reason for ${action.replaceAll("_", " ")}`) || "";
        if (!reason.trim()) return;
        const event = row.event;
        try {
          const response = await fetch(`/v1/events/${encodeURIComponent(event.device_id)}/${encodeURIComponent(event.event_id)}/review`, {
            method: "POST",
            headers: { Authorization: `Bearer ${reviewerToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({
              action,
              expected_review_version: row.review.review_version,
              viewed_event_revision: event.revision,
              viewed_event_hash: row.event_hash,
              viewed_evidence_versions: event.payload.evidence_versions || {},
              reason: reason.trim(),
            }),
          });
          if (response.status === 409) {
            await refresh();
            status.textContent = "Review conflict: the event or review changed. Inspect the refreshed event, then choose again.";
            return;
          }
          if (response.status === 401) reviewerToken = "";
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || `Review failed (${response.status}).`);
          }
          await refresh();
        } catch (error) {
          status.textContent = `${error.message} Review was not applied.`;
        }
      }
      refresh();
      window.setInterval(refresh, 3000);
    })();
  </script>
</body>
</html>
